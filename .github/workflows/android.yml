name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Mirrors the two verification commands required by AGENTS.md. The
      # release build stays unsigned on CI because keystore.properties is
      # gitignored; R8 still runs, so shrinker regressions surface here.
      - name: Debug build, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Release build, unit tests and lint
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
