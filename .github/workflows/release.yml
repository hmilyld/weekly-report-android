name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag is the release identity, so make sure history and tags exist.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The app version lives in gradle.properties; the tag must agree with it so
      # that what users install reports the version they downloaded.
      - name: Check the tag matches app.versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "::error::app.versionName is missing from gradle.properties"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.versionName=${version}"
            exit 1
          fi
          echo "Releasing $version"

      - name: Extract the changelog section for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${tag}; write one before tagging."
            exit 1
          fi

      # Optional: set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD as repository secrets to publish a signed APK.
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify
        run: ./gradlew :app:spotlessCheck :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build release
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --stacktrace

      - name: Note an unsigned build in the release notes
        run: |
          if [ ! -f keystore.properties ]; then
            printf '\n> 本次 APK 由 CI 构建但未签名，安装前请自行签名或改用本地构建产物。\n' >> release-notes.md
          fi

      # The app reads this static asset instead of the GitHub API, which is
      # limited to 60 anonymous requests per hour per IP. apkUrl is pinned to
      # this tag, so a user who accepts 1.1.0 still downloads 1.1.0 even if
      # 1.2.0 has been published in the meantime.
      #
      # An unsigned APK cannot be installed over the release it would replace,
      # so no manifest is published in that case: the app then falls back to
      # the API and simply offers the release page. The asset list is built from
      # what this step actually produced, so the published files always match
      # the manifest and a missing APK still fails the release.
      - name: Build update.json
        run: |
          if [ ! -f keystore.properties ]; then
            echo "Unsigned build; skipping update.json so clients keep using the API."
            echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
            echo "app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            exit 0
          fi
          # Exactly one APK is expected; more than one would make the manifest
          # point at a file the release may not carry under that name.
          apks=($(ls app/build/outputs/apk/release/*.apk))
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^app\.versionCode=//p' gradle.properties)"
          node tools/write-update-manifest.js \
            --out update.json \
            --version "$version" \
            --code "$version_code" \
            --tag "${GITHUB_REF_NAME}" \
            --apk "${apks[0]}" \
            --notes release-notes.md \
            --repo "${GITHUB_REPOSITORY}"
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          echo "${apks[0]}" >> "$GITHUB_ENV"
          echo "update.json" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: 周记 ${{ github.ref_name }}
          body_path: release-notes.md
          # Built by the previous step: the APK alone for an unsigned build,
          # the APK plus update.json otherwise.
          files: ${{ env.RELEASE_FILES }}
          fail_on_unmatched_files: true
